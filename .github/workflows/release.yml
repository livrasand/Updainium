name: Publish release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: Release tag (for example, v0.1.0)
        required: true
        type: string
      prerelease:
        description: Mark the GitHub release as a prerelease
        required: false
        default: false
        type: boolean
      create_discussion:
        description: Create a discussion for the release
        required: false
        default: false
        type: boolean
      discussion_category:
        description: Discussion category used when "Create a discussion" is enabled (must already exist in the repository)
        required: false
        default: Announcements
        type: string

permissions:
  contents: write  # needed by the publish job to create the GitHub release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundles: deb,rpm,appimage
          - os: windows-latest
            bundles: msi,nsis
          - os: macos-latest
            bundles: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev libwebkit2gtk-4.1-dev patchelf rpm
      - run: npm ci
      - run: npm run tauri -- build --bundles ${{ matrix.bundles }}
        env:
          # Let the macOS bundler lay out the DMG window (background and icon
          # positions) instead of skipping it because of the CI environment.
          TAURI_BUNDLER_DMG_IGNORE_CI: "true"
      - name: Verify Linux glibc baseline
        if: runner.os == 'Linux'
        run: |
          highest="$(objdump -T src-tauri/target/release/updainium | grep -oE 'GLIBC_[0-9.]+' | sort -uV | tail -n1)"
          echo "Newest required glibc symbol: $highest"
          if [ "$(printf '%s\nGLIBC_2.35\n' "$highest" | sort -uV | tail -n1)" != "GLIBC_2.35" ]; then
            echo "The Linux binary requires $highest, which is newer than the supported GLIBC_2.35 baseline."
            exit 1
          fi
      - name: Verify macOS ad-hoc signature
        if: runner.os == 'macOS'
        run: |
          dmg_path="$(find src-tauri/target/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$dmg_path"
          mount_path="$RUNNER_TEMP/updainium-dmg"
          mkdir -p "$mount_path"
          hdiutil attach "$dmg_path" -nobrowse -readonly -mountpoint "$mount_path"
          trap 'hdiutil detach "$mount_path" -quiet' EXIT
          app_path="$(find "$mount_path" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
      - uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ runner.os }}
          path: src-tauri/target/release/bundle
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      discussions: write  # needed when a release discussion is requested
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Prepare release assets and checksums
        run: |
          mkdir release
          find dist -type f \( -iname '*.appimage' -o -iname '*.deb' -o -iname '*.dmg' -o -iname '*.exe' -o -iname '*.msi' -o -iname '*.rpm' \) -exec cp {} release/ \;
          test -n "$(find release -type f -print -quit)"
          (cd release && sha256sum * > SHA256SUMS)
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tag_name }}
          PRERELEASE: ${{ inputs.prerelease }}
          CREATE_DISCUSSION: ${{ inputs.create_discussion }}
          DISCUSSION_CATEGORY: ${{ inputs.discussion_category }}
        run: |
          extra_args=()
          if [ "$PRERELEASE" = "true" ]; then
            extra_args+=(--prerelease)
          fi
          if [ "$CREATE_DISCUSSION" = "true" ]; then
            if [ -z "$DISCUSSION_CATEGORY" ]; then
              echo "Creating a discussion requires a discussion_category."
              exit 1
            fi
            extra_args+=(--discussion-category "$DISCUSSION_CATEGORY")
          fi
          gh release create "$TAG_NAME" release/* "${extra_args[@]}" \
            --target "$GITHUB_SHA" --title "$TAG_NAME" --generate-notes
