# Verifies that Updainium builds and launches on macOS, Linux and Windows,
# captures screenshots of the running app and of the installers, and posts the
# evidence as a comment on the issue given in the input. It only runs when a
# maintainer dispatches it manually; pushes and pulls never trigger it, and
# there is no parallel PR-comment workflow from it.
#
# When all three platforms pass, the issue gets the "verified" label. The
# "Publish release" workflow requires that label on the given issue, so
# releasing is authorized by this run on the issue it posted to.

name: Verify

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue whose comment gets the evidence; must be open (and has the verified label when everything passes)'
        required: true
        type: string

concurrency:
  group: verify-${{ inputs.issue_number }}
  cancel-in-progress: true

env:
  DISPLAY: ':99' # Linux: Xvfb is started on this display

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: Build, launch and screenshot (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundles: appimage
          - os: macos-latest
            bundles: dmg
          - os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      APP_NAME: updainium
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev \
            libayatana-appindicator3-dev libwebkit2gtk-4.1-dev patchelf \
            xvfb imagemagick libwebkit2gtk-4.1-0 libayatana-appindicator3-1 xdg-user-dirs 'libasound2'

      - name: Build
        env:
          # Let the macOS bundler lay out the DMG window (background and icon
          # positions) instead of skipping it because of the CI environment.
          TAURI_BUNDLER_DMG_IGNORE_CI: "true"
        run: |
          npm ci
          npm run tauri -- build --bundles ${{ matrix.bundles }}

      # --- Evidence: launch the built app and capture the screen -----------

      - name: Launch and screenshot (Linux)
        if: runner.os == 'Linux'
        run: |
          : > .verify
          mkdir evidence
          export XDG_RUNTIME_DIR=/tmp/xdg
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 0700 "$XDG_RUNTIME_DIR"
          Xvfb :99 -screen 0 1280x800x24 >/dev/null 2>&1 &
          sleep 2
          export DISPLAY=:99
          ./src-tauri/target/release/updainium >/dev/null 2>&1 &
          APP_PID=$!
          sleep 20 # give the window time to show
          import -window root -density 96 evidence/screenshot-linux.png
          kill "$APP_PID" 2>/dev/null || true
          wait "$APP_PID" 2>/dev/null || true
          test -s evidence/screenshot-linux.png && echo linux=ok >> .verify

      - name: Screenshot the installer (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          mkdir -p evidence
          dmg_path="$(find src-tauri/target/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$dmg_path"
          mount_path="$RUNNER_TEMP/updainium-dmg-installer"
          mkdir -p "$mount_path"
          hdiutil attach "$dmg_path" -nobrowse -readonly -mountpoint "$mount_path"
          trap 'hdiutil detach "$mount_path" -quiet || true' EXIT
          open "$mount_path"
          sleep 8 # give Finder time to render the custom DMG window
          bounds="$(osascript -e 'tell application "Finder" to get bounds of front window' 2>/dev/null || true)"
          if [[ -n "$bounds" ]]; then
            IFS=',' read -r x1 y1 x2 y2 <<< "$bounds"
            x=$((x1)); y=$((y1)); w=$((x2 - x1)); h=$((y2 - y1))
            screencapture -x -R"${x},${y},${w},${h}" evidence/installer-macos.png
          else
            screencapture -x evidence/installer-macos.png
          fi
          test -s evidence/installer-macos.png

      - name: Launch and screenshot (macOS)
        if: runner.os == 'macOS'
        run: |
          : > .verify
          mkdir evidence
          dmg_path="$(find src-tauri/target/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$dmg_path"
          mount_path="$RUNNER_TEMP/updainium-dmg"
          mkdir -p "$mount_path"
          hdiutil attach "$dmg_path" -nobrowse -readonly -mountpoint "$mount_path"
          trap 'hdiutil detach "$mount_path" -quiet' EXIT
          APP="$(find "$mount_path" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP"
          cp -R "$APP" "$RUNNER_TEMP/Updainium.app"
          APP="$RUNNER_TEMP/Updainium.app"
          codesign --force --deep -s - "$APP"
          open "$APP"
          sleep 20 # give the window time to show
          screencapture -x evidence/screenshot-macos.png
          osascript -e 'tell application "System Events" to get name of processes' >/dev/null || true
          pkill "updainium" 2>/dev/null || true
          test -s evidence/screenshot-macos.png && echo macos=ok >> .verify

      - name: Screenshot the installer (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path evidence | Out-Null
          $setup = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $setup) { throw "NSIS installer not found" }
          $proc = Start-Process -FilePath $setup.FullName -PassThru
          for ($i = 0; $i -lt 20 -and $proc.MainWindowHandle -eq 0; $i++) {
            Start-Sleep -Seconds 1
            $proc.Refresh()
          }
          Start-Sleep -Seconds 2 # let the wizard paint
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          Add-Type @"
          using System;
          using System.Runtime.InteropServices;
          public class InstallerWin32 {
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr hWnd, out RECT rect);
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr hWnd);
            [DllImport("user32.dll")] public static extern bool ShowWindow(IntPtr hWnd, int nCmdShow);
            public struct RECT { public int Left; public int Top; public int Right; public int Bottom; }
          }
          "@
          $bounds = [System.Windows.Forms.SystemInformation]::VirtualScreen
          $rect = New-Object InstallerWin32+RECT
          $captured = $false
          if ($proc.MainWindowHandle -ne 0) {
            [InstallerWin32]::ShowWindow($proc.MainWindowHandle, 5) | Out-Null
            [InstallerWin32]::SetForegroundWindow($proc.MainWindowHandle) | Out-Null
            Start-Sleep -Seconds 1
          }
          if ($proc.MainWindowHandle -ne 0 -and [InstallerWin32]::GetWindowRect($proc.MainWindowHandle, [ref]$rect)) {
            $w = $rect.Right - $rect.Left
            $h = $rect.Bottom - $rect.Top
            if ($w -gt 0 -and $h -gt 0) {
              try {
                $bmp = New-Object System.Drawing.Bitmap $w, $h
                $g = [System.Drawing.Graphics]::FromImage($bmp)
                $g.CopyFromScreen($rect.Left, $rect.Top, 0, 0, (New-Object System.Drawing.Size $w, $h))
                $bmp.Save("evidence/installer-windows.png", [System.Drawing.Imaging.ImageFormat]::Png)
                $captured = $true
              } catch {
                Write-Warning "Could not capture the installer window: $_"
              }
            }
          }
          if (-not $captured) {
            $bmp = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
            $bmp.Save("evidence/installer-windows.png", [System.Drawing.Imaging.ImageFormat]::Png)
          }
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          if ((Get-Item evidence/installer-windows.png).Length -le 0) { throw "empty screenshot" }

      - name: Launch and screenshot (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          APP_EXE: src-tauri/target/release/updainium.exe
        run: |
          New-Item -ItemType Directory -Force -Path evidence | Out-Null
          "" | Out-File -FilePath .verify -Encoding ascii
          Start-Process $env:APP_EXE -RedirectStandardError app.err
          Start-Sleep -Seconds 20 # give the window time to show
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          $bounds = [System.Windows.Forms.SystemInformation]::VirtualScreen
          $bmp = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
          $graphics = [System.Drawing.Graphics]::FromImage($bmp)
          $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
          $bmp.Save("evidence/screenshot-windows.png", [System.Drawing.Imaging.ImageFormat]::Png)
          Get-Process -Name 'updainium' -ErrorAction SilentlyContinue | Stop-Process
          if ((Get-Item evidence/screenshot-windows.png).Length -gt 0) { "windows=ok" | Out-File -Append -Encoding ascii .verify }

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-evidence-${{ runner.os }}
          path: |
            evidence/
            .verify
          retention-days: 7

  # One comment on the issue using the same marker every time, updated on
  # re-runs. Screenshots have to come from an asset in a (prerelease)
  # ci-screenshots release: no GITHUB_TOKEN-based attachment upload exists.
  report:
    name: Post the evidence on the issue
    needs: verify
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read # download the artifacts
      contents: write # upload screenshots to the ci-screenshots release
      issues: write # comment there, add the verified label
    env:
      ISSUE: ${{ inputs.issue_number }}
      GH_TOKEN: ${{ github.token }}
      MARKER: '<!-- updainium-verify-evidence -->'
    steps:
      - name: Download the evidence artifacts
        run: |
          mkdir out
          if ! gh run download "$RUN_ID" -R "$REPO" -D "out" ; then
            echo "The test did not get far enough to leave evidence."
            exit 1
          fi
        env:
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}

      - name: Check that the issue exists and is open
        run: |
          gh issue view "$ISSUE" -R "$REPO" --json state --jq .state
          gh issue view "$ISSUE" -R "$REPO" --json state --jq .state | grep -xiq open || {
            echo "Issue $ISSUE is not open on $REPO; not reporting."; exit 1; }
        env:
          REPO: ${{ github.repository }}

      - name: Upload the screenshots to a per-run release
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          : > images.txt
          RELEASE_TAG="ci-screenshots-${ISSUE}-${GITHUB_RUN_ID}"

          # Collect PNGs first; skip the whole release machinery if there are none.
          shopt -s nullglob
          pngs=( out/*/evidence/*.png )
          if [[ ${#pngs[@]} -eq 0 ]]; then
            echo "No screenshot PNGs found — skipping release upload."
            exit 0
          fi

          # Draft releases are invisible to the /releases/tags/{tag} endpoint
          # (and therefore unreliable to resolve by tag in gh), so everything
          # here works with the release ID obtained from the list endpoint,
          # which does include drafts. The lookup first makes the step
          # idempotent on re-runs of the same run ID.
          RELEASE_ID="$(gh api "repos/${REPO}/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"${RELEASE_TAG}\") | .id")"
          if [[ -z "$RELEASE_ID" ]]; then
            RELEASE_ID="$(gh api --method POST "repos/${REPO}/releases" \
              -f tag_name="$RELEASE_TAG" \
              -f target_commitish="$SHA" \
              -f name="CI screenshots (run ${GITHUB_RUN_ID})" \
              -f body="Updainium verification screenshots, used in issues" \
              -F draft=true --jq .id)"
          fi
          test -n "$RELEASE_ID"

          for f in "${pngs[@]}"; do
            [ -f "$f" ] || continue
            base="$(basename "$f" .png)"
            case "$base" in
              screenshot-macos)   os=macos;   kind=app ;;
              installer-macos)    os=macos;   kind=installer ;;
              screenshot-linux)   os=linux;   kind=app ;;
              installer-linux)    os=linux;   kind=installer ;;
              screenshot-windows) os=windows; kind=app ;;
              installer-windows)  os=windows; kind=installer ;;
              screenshot-*)       os="${base#screenshot-}"; kind=app ;;
              installer-*)        os="${base#installer-}";  kind=installer ;;
              *)                  os="$base"; kind=app ;;
            esac
            mime="$(file -b --mime-type "$f")"
            [[ "$mime" == image/png ]] || continue
            name="verify-${ISSUE}-${GITHUB_RUN_ID:0:8}-${base}.png"
            cp "$f" "$name"
            gh api --method POST \
              "repos/${REPO}/releases/${RELEASE_ID}/assets?name=${name}" \
              -H "Content-Type: application/octet-stream" \
              --input "$name" --jq .name >/dev/null
            url="https://github.com/$REPO/releases/download/${RELEASE_TAG}/${name}"
            printf '%s\t%s\t%s\n' "$os" "$kind" "$url" >> images.txt
          done

          # Publish the draft so asset URLs are publicly accessible from the issue.
          gh api -X PATCH "repos/${REPO}/releases/${RELEASE_ID}" -F draft=false >/dev/null

          cat images.txt

      - name: Compose the comment and update the issue
        run: |
          set -euo pipefail

          status() {
            local os_key="$1"
            local art="$2"
            local f="out/${art}/.verify"
            if [[ -f "$f" ]] && grep -q "^${os_key}=ok$" "$f"; then
              echo '✔️ funciona'
            else
              echo '❌ no funcionó — revisa el log'
            fi
          }

          emit_section() {
            local os_key="$1"
            local title="$2"
            local found=0
            local os kind url label
            while IFS=$'\t' read -r os kind url; do
              [[ -z "${os:-}" || -z "${url:-}" ]] && continue
              [[ "$os" == "$os_key" ]] || continue
              case "$kind" in
                installer) label="Instalador" ;;
                *)         label="Aplicación en ejecución" ;;
              esac
              if [[ $found -eq 0 ]]; then
                echo "### $title"
                echo
              fi
              echo "**$label**"
              echo
              echo "![$label — $title]($url)"
              echo
              found=1
            done < images.txt
          }

          {
            echo "$MARKER"
            echo '## 🔬 Evidencia de verificación (Updainium — macOS, Linux, Windows)'
            echo
            echo "| Plataforma | Resultado |"
            echo "|------------|-----------|"
            echo "| macOS      | $(status macos verify-evidence-macOS) |"
            echo "| Linux      | $(status linux verify-evidence-Linux) |"
            echo "| Windows    | $(status windows verify-evidence-Windows) |"
            echo
            if [[ -s images.txt ]]; then
              emit_section macos macOS
              emit_section linux Linux
              emit_section windows Windows

              while IFS=$'\t' read -r os kind url; do
                [[ -z "${os:-}" || -z "${url:-}" ]] && continue
                [[ "$os" =~ ^(macos|linux|windows)$ ]] && continue
                echo "### Captura de verificación (${os})"
                echo
                echo "![Captura de verificación]($url)"
                echo
              done < images.txt

              if ! grep -q $'^linux\tinstaller\t' images.txt; then
                echo "_Linux distribuye AppImage/deb/rpm sin asistente gráfico; no hay captura de instalador._"
                echo
              fi
            fi
            echo "[Log completo de la verificación](${RUN_URL})"
          } > comment.md

          cat comment.md

          gh issue comment "$ISSUE" -R "$REPO" --edit-last --create-if-new --body-file comment.md

          if [[ -f out/verify-evidence-macOS/.verify ]] && grep -q '^macos=ok$' out/verify-evidence-macOS/.verify && \
             [[ -f out/verify-evidence-Linux/.verify ]] && grep -q '^linux=ok$'  out/verify-evidence-Linux/.verify  && \
             [[ -f out/verify-evidence-Windows/.verify ]] && grep -q '^windows=ok$' out/verify-evidence-Windows/.verify; then
            gh label create verified -R "$REPO" --color 0e8a16 --description "Verificado en macOS, Linux y Windows" 2>/dev/null || true
            gh issue edit "$ISSUE" -R "$REPO" --add-label verified
            echo "Autorizado: issue #$ISSUE etiquetado como verified. Ya se puede lanzar 'Publish release'."
          else
            echo "Faltan alguna plataforma por pasar. No se añade la etiqueta verified."
          fi
        env:
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
