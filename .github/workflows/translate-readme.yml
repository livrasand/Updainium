
name: Translate README

on:
  push:
    branches:
      - master
    paths:
      - README.md
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: translate-readme
  cancel-in-progress: false

jobs:
  translate:
    name: Translate README
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master
          token: ${{ secrets.TRANSLATION_TOKEN }}

      - name: Create translation branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B automation/readme-translations
          git push origin automation/readme-translations --force

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Translate README - Chinese
        uses: livrasand/gh-translate-readme@v1.0.0
        with:
          LANG: zh-CN
          LANG_NAME: 简体中文
          FLAG: cn
          SOURCE_LANG: en

      - name: Translate README - Hindi
        uses: livrasand/gh-translate-readme@v1.0.0
        with:
          LANG: hi
          LANG_NAME: हिन्दी
          FLAG: in
          SOURCE_LANG: en

      - name: Translate README - Spanish
        uses: livrasand/gh-translate-readme@v1.0.0
        with:
          LANG: es
          LANG_NAME: Español
          FLAG: es
          SOURCE_LANG: en

      - name: Translate README - Arabic
        uses: livrasand/gh-translate-readme@v1.0.0
        with:
          LANG: ar
          LANG_NAME: العربية
          FLAG: sa
          SOURCE_LANG: en

      - name: Translate README - French
        uses: livrasand/gh-translate-readme@v1.0.0
        with:
          LANG: fr
          LANG_NAME: Français
          FLAG: fr
          SOURCE_LANG: en

      - name: Translate README - Bengali
        uses: livrasand/gh-translate-readme@v1.0.0
        with:
          LANG: bn
          LANG_NAME: বাংলা
          FLAG: bd
          SOURCE_LANG: en

      - name: Translate README - Portuguese
        uses: livrasand/gh-translate-readme@v1.0.0
        with:
          LANG: pt
          LANG_NAME: Português
          FLAG: pt
          SOURCE_LANG: en

      - name: Translate README - Indonesian
        uses: livrasand/gh-translate-readme@v1.0.0
        with:
          LANG: id
          LANG_NAME: Bahasa Indonesia
          FLAG: id
          SOURCE_LANG: en

      - name: Translate README - Urdu
        uses: livrasand/gh-translate-readme@v1.0.0
        with:
          LANG: ur
          LANG_NAME: اردو
          FLAG: pk
          SOURCE_LANG: en

      - name: Create or update Pull Request
        env:
          GH_TOKEN: ${{ secrets.TRANSLATION_TOKEN }}
        run: |
          BRANCH="automation/readme-translations"
          TITLE="docs: update README translations"

          EXISTING_PR=$(gh pr list \
            --base master \
            --head "$BRANCH" \
            --state open \
            --json url \
            --jq '.[0].url')

          if [ -n "$EXISTING_PR" ]; then
            gh pr edit "$EXISTING_PR" \
              --title "$TITLE" \
              --body "Automated README translations.

          Generated by livrasand/gh-translate-readme.

          Please review the translations before merging."
          else
            gh pr create \
              --base master \
              --head "$BRANCH" \
              --title "$TITLE" \
              --body "Automated README translations.

          Generated by livrasand/gh-translate-readme.

          Please review the translations before merging."
          fi
