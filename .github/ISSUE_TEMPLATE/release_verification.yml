name: 🔬 Release verification
description: Issue where the manual Verify cycle (build, screenshots and authorization) is recorded before publishing a new release.
title: "Release verification: v1.0.0"
labels:
  - testing
body:
  - type: markdown
    attributes:
      value: |
        A maintainer runs the **Verify** workflow on this issue: it builds the
        app for macOS, Linux and Windows, launches it on each of them and takes
        a screenshot as evidence. When **all three platforms pass**, this issue
        gets the **verified** label, which is the authorization needed before
        the release is published.

  - type: checkboxes
    id: verification
    attributes:
      label: Verification checklist
      description: All checks must pass before authorizing the release.
      options:
        - label: Successful build on macOS, Linux, and Windows
          required: true
        - label: App launches without errors on all three platforms
          required: true
        - label: Evidence screenshots captured for all three platforms
          required: true
